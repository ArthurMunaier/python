{% extends "layout.html" %}

{% block conteudo %}

<h2>Editar filme</h2>

<form method="POST">
    <label for="titulo">Título:</label>
    <input type="text" id="titulo" name="titulo" value="{{ filme.titulo }}" required>

    <label for="genero">Gênero:</label>
    <input type="text" id="genero" name="genero" value="{{ filme.genero }}" required>

    <label for="duracao">Duração em minutos:</label>
    <input type="number" id="duracao" name="duracao" value="{{ filme.duracao }}" min="1" required>

    <button type="submit">Salvar alterações</button>
</form>

{% endblock %}
