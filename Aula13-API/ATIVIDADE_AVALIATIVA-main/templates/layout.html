<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>Sistema de Cinema</h1>

        <nav>
            <a href="{{ url_for('cinema.index') }}">Início</a>
            <a href="{{ url_for('cinema.filmes') }}">Filmes</a>
            <a href="{{ url_for('cinema.salas') }}">Salas</a>
            <a href="{{ url_for('cinema.sessoes') }}">Sessões</a>
        </nav>
    </header>

    <main>
        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                {% for mensagem in mensagens %}
                    <div class="mensagem">{{ mensagem }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block conteudo %}
        {% endblock %}
    </main>

</body>
</html>
